name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble, sign and zip
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          APP=Contxt.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/apple/Products/Release/Contxt "$APP/Contents/MacOS/Contxt"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"

          # A stable self-signed identity keeps the app's designated requirement
          # identical across builds, so macOS keeps its permission grants.
          if [ -n "$P12_BASE64" ]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PW="$(uuidgen)"
            echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/identity.p12"
            security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
            security import "$RUNNER_TEMP/identity.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            security find-certificate -c "Contxt Local Signing" -p "$KEYCHAIN" > "$RUNNER_TEMP/identity.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/identity.pem"
            codesign --force --deep -s "Contxt Local Signing" --keychain "$KEYCHAIN" "$APP"
          else
            codesign --force --deep -s - "$APP"
          fi
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|Signature|Identifier"
          codesign -d -r- "$APP" 2>&1 | grep designated

          ditto -c -k --sequesterRsrc --keepParent "$APP" "Contxt-$VERSION-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Contxt-macOS
          path: Contxt-*-macOS.zip
